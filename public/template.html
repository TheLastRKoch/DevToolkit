<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devtoolkit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Devtoolkit</a>
            <div class="d-flex align-items-center gap-2">
                <label class="text-white mb-0" for="titleInput">Title</label>
                <input id="titleInput" class="form-control form-control-sm" type="text" aria-label="Title">
                <button id="btnNewSession" class="btn btn-outline-light btn-sm" type="button">New session</button>
            </div>
        </div>
    </nav>

    <main class="container-fluid flex-grow-1 d-flex flex-column">
        <div class="row mt-3">
            <div class="col-md-6">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/">Home</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Template</li>
                    </ol>
                </nav>
            </div>
            <div class="col-md-6 text-end">
                <button id="btnClearVariables" class="btn btn-outline-secondary btn-sm" type="button">Clear variables</button>
                <button id="btnClearAll" class="btn btn-outline-danger btn-sm" type="button">Clear all</button>
            </div>
        </div>
        <div class="row flex-grow-1 mt-3">
            <section class="col-md-6 d-flex flex-column mb-3">
                <label class="form-label" for="txtInput">Template</label>
                <textarea class="form-control font-monospace flex-grow-1" id="txtInput"
                    placeholder="Write text with tokens such as @[name]"></textarea>
            </section>
            <section class="col-md-3 mb-3">
                <h2 class="h6">Variables</h2>
                <div id="variablesPanel" class="d-flex flex-column gap-2"></div>
            </section>
            <section class="col-md-3 d-flex flex-column mb-3">
                <label class="form-label" for="txtOutput">Rendered output</label>
                <textarea class="form-control font-monospace flex-grow-1" id="txtOutput" readonly></textarea>
            </section>
        </div>
    </main>

    <footer class="bg-light">
        <div class="text-center py-2">&copy; <span id="currentYear"></span> Devtoolkit. All rights reserved.</div>
    </footer>
    <script src="/static/scripts/template.js"></script>
</body>

</html>
