<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Editor – Devtoolkit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico">
    <style>
        html, body {
            height: 100%;
        }

        #codeEditorWorkspace {
            min-height: 0;
            height: calc(100vh - 176px);
        }

        @media (min-width: 768px) {
            #codeEditorWorkspace {
                margin-left: 200px;
                margin-right: 200px;
            }
        }

        #codeEditorMount {
            min-height: 0;
            flex: 1 1 auto;
            overflow: hidden;
        }

        #codeEditorMount .cm-editor {
            height: 100%;
        }

        #codeEditorMount .cm-scroller {
            overflow: auto;
            font-family: monospace;
            font-size: 0.9rem;
        }

        #codeEditorMount .cm-editor.cm-focused {
            outline: none;
        }

        #languageMenu {
            min-width: 10rem;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Devtoolkit</a>
        </div>
    </nav>

    <div class="container-fluid flex-grow-1 d-flex flex-column">
        <div id="pageHeader"></div>

        <div id="codeEditorWorkspace"
            class="d-flex flex-column flex-grow-1 border rounded shadow-sm overflow-hidden bg-white mt-3">
            <div id="codeEditorMount" class="form-control border-0 rounded-0 p-0" aria-label="Code editor"></div>

            <div id="editorStatusBar"
                class="d-flex justify-content-between align-items-center py-1 px-3 bg-light border-top text-muted small"
                style="min-height: 32px;">
                <div class="dropdown">
                    <button id="languageButton"
                        class="btn btn-sm btn-outline-secondary dropdown-toggle py-0 px-2 font-monospace"
                        type="button" aria-haspopup="true" aria-expanded="false"
                        aria-label="Code language">Plain Text</button>
                    <ul id="languageMenu" class="dropdown-menu" hidden></ul>
                </div>
                <span>Characters: <span id="charCount">0</span></span>
            </div>
        </div>
    </div>

    <footer class="bg-light">
        <div class="text-center py-2">DevToolKit fork me on
            <a href="https://github.com/TheLastRKoch/devtoolkit" target="_blank" rel="noopener noreferrer">github</a>
        </div>
    </footer>

    <script type="importmap">
        {
            "imports": {
                "codemirror": "https://esm.sh/codemirror@6.0.2",
                "@codemirror/state": "https://esm.sh/@codemirror/state@6.7.6",
                "@codemirror/view": "https://esm.sh/@codemirror/view@6.43.15",
                "@codemirror/language": "https://esm.sh/@codemirror/language@6.13.1",
                "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.11.1",
                "@codemirror/search": "https://esm.sh/@codemirror/search@6.7.2",
                "@codemirror/autocomplete": "https://esm.sh/@codemirror/autocomplete@6.20.4",
                "@codemirror/lint": "https://esm.sh/@codemirror/lint@6.9.8",
                "@lezer/common": "https://esm.sh/@lezer/common@1.5.5",
                "@lezer/highlight": "https://esm.sh/@lezer/highlight@1.2.5",
                "@lezer/lr": "https://esm.sh/@lezer/lr@1.4.12",
                "@codemirror/lang-javascript": "https://esm.sh/@codemirror/lang-javascript@6.2.5",
                "@codemirror/lang-json": "https://esm.sh/@codemirror/lang-json@6.0.2",
                "@codemirror/lang-html": "https://esm.sh/@codemirror/lang-html@6.4.12",
                "@codemirror/lang-css": "https://esm.sh/@codemirror/lang-css@6.3.1",
                "@codemirror/lang-markdown": "https://esm.sh/@codemirror/lang-markdown@6.5.2",
                "@codemirror/lang-python": "https://esm.sh/@codemirror/lang-python@6.2.1",
                "@codemirror/lang-sql": "https://esm.sh/@codemirror/lang-sql@6.10.0",
                "@codemirror/lang-xml": "https://esm.sh/@codemirror/lang-xml@6.1.0"
            }
        }
    </script>

    <script src="/static/scripts/browser-session.js"></script>
    <script src="/static/scripts/page-header.js"></script>
    <script src="/static/scripts/code-language.js"></script>
    <script src="/static/scripts/code-editor.js"></script>
    <script type="module" src="/static/scripts/code-editor-surface.js"></script>
</body>

</html>
