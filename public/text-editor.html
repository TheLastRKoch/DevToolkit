<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Editor – Devtoolkit</title>
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="static/img/favicon.ico">
</head>

<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Devtoolkit</a>
        </div>
    </nav>

    <div class="container-fluid flex-grow-1 d-flex flex-column">
        <div id="pageHeader"></div>
        <div class="row flex-grow-1 main-content mt-3">
            <div class="col-md-12 d-flex flex-column ps-3">
                <div class="tab-content flex-grow-1" id="rightTabContent">
                    <div class="tab-pane fade show active h-100" id="right-tab1" role="tabpanel"
                        aria-labelledby="right-tab1-tab">
                        <div class="form-control font-monospace" id="txtOutput" style="height: 712px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="bg-light">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12 text-center py-2">
                        &copy; <span id="currentYear"></span> Devtoolkit. All rights reserved.
                    </div>
                </div>
            </div>
        </footer>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>

    <script src="static/scripts/browser-session.js"></script>
    <script src="static/scripts/page-header.js"></script>
    <script src="static/scripts/text-editor.js"></script>
</body>

</html>
